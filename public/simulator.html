<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Симулятор SMS и звонков</title><link rel="stylesheet" href="/style.css"><style>.simulationSettings{margin:20px 0}#simulationLog{padding:20px;list-style:none;min-height:200px;margin:0}#simulationLog li{padding:10px 0;border-bottom:1px solid #20281c;overflow-wrap:anywhere;font-size:13px}.simulationButtons{display:flex;gap:8px}#simulationSummary{color:#99b4a3;font-size:13px}#simulationMode{color:#18bc80;font-size:13px}</style></head><body><main>
<section id="login"><form id="loginForm"><label>Пароль<input id="password" type="password" autocomplete="current-password" required></label><button class="primary">Войти →</button></form></section>
<section id="simulatorHub" hidden><nav class="modeTabs" aria-label="Режим"><a href="/">Текст</a><a href="/audio">Аудио</a><a href="/video">Видео</a><a href="/simulator" class="selected" aria-current="page">Симулятор</a></nav>
<h1>Симулятор SMS и звонков</h1><p id="simulationMode">Локальная симуляция. SMS, звонки и запросы к сервисам не отправляются.</p>
<form id="simulationForm" class="simulationSettings"><label>Номер для отображения<input id="simulationPhone" type="tel" autocomplete="off" maxlength="30" placeholder="+7 (700) 000-00-00" required></label><label>Сценарий<select id="simulationChannel"><option value="sms">SMS</option><option value="call">Звонки</option><option value="both">SMS + звонки</option></select></label><label>Количество шагов<input id="simulationCount" type="number" min="1" max="30" value="5" required></label><div class="simulationButtons"><button id="simulationStart" class="primary" type="submit">Запустить симуляцию</button><button id="simulationStop" type="button" disabled>Остановить</button><button id="simulationClear" type="button">Очистить</button></div></form>
<p id="simulationSummary" role="status"></p><section class="conversation"><ol id="simulationLog" role="log" aria-live="polite" aria-label="Смоделированные события"></ol></section>
</section><p id="error" role="alert"></p></main><script src="/simulator.js"></script></body></html>

<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Видео чат</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/video.css"><body><main><section id="login"><form id="loginForm"><label>Пароль панели<input id="password" type="password" autocomplete="current-password" required></label><button>Войти</button></form></section><section id="videoHub" hidden><nav class="modeTabs"><a href="/">Текстовый чат</a><a class="selected" href="/video">Видео чат</a></nav><div class="toolbar"><span id="bridgeStatus">Видео мост выключен</span><button id="bridgeToggle" disabled>Соединить участников</button></div><label class="consent"><input type="checkbox" id="consent" disabled>Оба подключённых участника знают, что их видео и звук передаются друг другу.</label><form id="sessionsForm" class="sessionsForm"><div class="sessionFields"><label>Сеанс OmeTV A (snid)<textarea id="sessionA" autocomplete="off" spellcheck="false" maxlength="38000" placeholder="{&quot;token&quot;: …, &quot;SnDataStr&quot;: …, &quot;SnHmac&quot;: …}" required></textarea></label><label>Сеанс OmeTV B (snid)<textarea id="sessionB" autocomplete="off" spellcheck="false" maxlength="38000" placeholder="{&quot;token&quot;: …, &quot;SnDataStr&quot;: …, &quot;SnHmac&quot;: …}" required></textarea></label></div><div class="sessionActions"><button id="applySessions">Применить и подключить A + B</button><span id="sessionStatus"></span></div><details><summary>Как получить сеанс</summary><p>Войдите в свои два сеанса на ometv.chat. В консоли каждого выполните <code>copy(localStorage.getItem('snid'))</code> и вставьте результат в поле выше. Здесь нужен полный JSON OmeTV; токен Nekto не подходит.</p></details></form><div id="videoCards"></div></section><p id="error" role="alert"></p></main><script src="/stream-player.js"></script><script src="/video.js"></script></body></html>

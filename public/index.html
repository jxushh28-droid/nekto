<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nekto Text Pair</title><link rel="stylesheet" href="/style.css"><body><main><header><span class="brand">NEKTO · TEXT PAIR</span><h1>Два собеседника. Один диалог.</h1><p>Подключите обе стороны — их сообщения будут пересылаться автоматически.</p></header><section id="login"><form id="loginForm"><label>Пароль панели<input id="password" type="password" autocomplete="current-password" required></label><button>Войти</button></form></section><section id="hub" hidden><div class="toolbar"><span id="bridge" role="status">Ожидаем два подключения</span><button id="connectBoth">Подключить обоих</button></div><details id="tokens"><summary>authToken для двух сеансов</summary><form id="tokenForm"><label>Чат A<input id="tokenA" type="password" autocomplete="off" maxlength="2048" placeholder="authToken A" required></label><label>Чат B<input id="tokenB" type="password" autocomplete="off" maxlength="2048" placeholder="authToken B" required></label><button id="applyTokens">Применить и подключить</button></form><p id="tokenResult" role="status"></p></details><div id="cards"></div></section><p id="error" role="alert"></p></main><script src="/app.js"></script></body></html>

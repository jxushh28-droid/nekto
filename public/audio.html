<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nekto Audio Pair</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/audio.css"><body><main><section id="login"><form id="loginForm"><label>Пароль панели<input id="password" type="password" autocomplete="current-password" required></label><button>Войти</button></form></section><section id="hub" hidden><nav class="modeTabs"><a href="/">Текст</a><a class="selected" href="/audio">Аудио</a><a href="/video">Видео</a></nav><div class="toolbar"><span id="bridge" role="status">Ожидаем два подключения</span><button id="connectBoth">Подключить обоих</button></div><section id="tokens"><h2>Голосовые authToken</h2><form id="tokenForm"><label>Сеанс A<input id="tokenA" type="text" autocomplete="off" spellcheck="false" placeholder="authToken A" required maxlength="2048"></label><label>Сеанс B<input id="tokenB" type="text" autocomplete="off" spellcheck="false" placeholder="authToken B (необязательно)" maxlength="2048"></label><button id="applyTokens">Тест A — один звонок</button><button id="applyTokenB" type="button">Тест B — один звонок</button><button id="applyBoth" type="button">Применить оба и подключить</button></form><p class="help">Для теста достаточно одного токена. Тест A/B закрывает другую сторону и запускает только выбранную. На nekto-me.kz/audiochat: JSON.parse(localStorage.getItem('storage_audio_v2')).user.authToken</p><p id="tokenResult" role="status"></p></section><label class="consent"><input id="consent" type="checkbox">Оба участника согласны на соединение друг с другом</label><div id="cards"></div></section><p id="error" role="alert"></p></main><script src="/audio.js"></script></body></html>
